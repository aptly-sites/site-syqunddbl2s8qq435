name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Agent Forms password configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_FORMS_PASSWORD_HASH: ${{ secrets.AGENT_FORMS_PASSWORD_HASH }}
          PAGES_PROJECT: ${{ github.event.repository.name }}
        run: |
          if [ -n "$AGENT_FORMS_PASSWORD_HASH" ]; then
            printf '%s' "$AGENT_FORMS_PASSWORD_HASH" | npx --yes wrangler@4 pages secret put AGENT_FORMS_PASSWORD_HASH --project-name="$PAGES_PROJECT"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ github.event.repository.name }}
